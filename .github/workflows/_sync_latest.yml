name: temporary-sync-latest
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply uploaded project snapshot
        shell: bash
        run: |
          python - <<'PY'
          import base64, io, tarfile, os
          payload = """"""
          data = base64.b64decode(payload)
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as tf:
              tf.extractall(".")
          for path in ["Docs/ADS_14轴接入与映射说明.md","Docs/项目文件分类与职责说明.md"]:
              if os.path.exists(path):
                  os.remove(path)
          PY
          rm -f .github/workflows/_sync_latest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Sync latest runnable ZNQInterface 2026-09-28"
          git push origin HEAD:main
